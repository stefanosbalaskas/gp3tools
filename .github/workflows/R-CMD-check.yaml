name: R-CMD-check

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: true

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel'}

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Standard r-lib/pak dependency installation remains unchanged on
      # Linux and Windows, where it is passing reliably.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: runner.os != 'macOS'
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # On GitHub's ARM64 macOS runner, pak repeatedly downloaded CRAN
      # binaries that it then rejected as unknown archive types. Use
      # base R/remotes for this lane only, retaining ordinary CRAN macOS
      # binaries and the exact certified eyeprocess dependency.
      - name: Install dependencies on macOS without pak
        if: runner.os == 'macOS'
        shell: Rscript {0}
        run: |
          options(
            repos = c(CRAN = "https://cloud.r-project.org")
          )

          install.packages(
            c(
              "remotes",
              "rcmdcheck",
              "sessioninfo"
            )
          )

          remotes::install_github(
            "stefanosbalaskas/eyeprocess@v0.12.0",
            dependencies = FALSE,
            upgrade = "never",
            build_vignettes = FALSE
          )

          remotes::install_deps(
            dependencies = c(
              "Depends",
              "Imports",
              "LinkingTo",
              "Suggests"
            ),
            upgrade = "never"
          )

          stopifnot(
            requireNamespace("eyeprocess", quietly = TRUE),
            utils::packageVersion("eyeprocess") >= package_version("0.12.0"),
            requireNamespace("rcmdcheck", quietly = TRUE),
            requireNamespace("testthat", quietly = TRUE),
            requireNamespace("rmarkdown", quietly = TRUE)
          )

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
